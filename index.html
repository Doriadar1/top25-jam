<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מצעד הג'אם</title>
<meta name="theme-color" content="#120a24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Secular+One&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#120a24;--bg2:#24124a;--gold:#ffcf4a;--gold2:#ff9f1c;--pink:#ff3d8b;--cyan:#3de0ff;--ink:#fff6e6;--muted:#b9a9d6;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;overflow:hidden}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-decoration:none}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 70% at 50% 0%,#3a1a78 0%,transparent 60%),radial-gradient(90% 60% at 50% 110%,#5a0f4a 0%,transparent 60%),var(--bg)}
.beam{position:absolute;bottom:-10%;width:34vmax;height:140vh;transform-origin:50% 100%;opacity:.16;filter:blur(6px);
  background:linear-gradient(to top,var(--c) 0%,transparent 85%);clip-path:polygon(44% 100%,56% 100%,100% 0,0 0);animation:sweep var(--d) ease-in-out infinite alternate}
.beam.b1{left:-8%;--c:var(--pink);--d:7s;transform:rotate(25deg)}
.beam.b2{right:-8%;--c:var(--cyan);--d:8s;transform:rotate(-25deg);animation-delay:-3s}
.beam.b3{left:33%;--c:var(--gold);--d:9s;animation-delay:-5s}
@keyframes sweep{from{rotate:-14deg}to{rotate:14deg}}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.scr{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.scr[hidden]{display:none}
.wrap{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;align-items:center}

/* HOME */
#home{justify-content:center;text-align:center}
.kicker{font-family:Bungee,sans-serif;letter-spacing:.18em;font-size:13px;color:var(--cyan);text-shadow:0 0 12px rgba(61,224,255,.6)}
.logo{margin:14px 0 4px;position:relative}
.logo .top{font-family:Bungee,sans-serif;font-size:clamp(84px,30vw,170px);line-height:.85;
  background:linear-gradient(180deg,#fff7d0 0%,var(--gold) 45%,var(--gold2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #7a2a00) drop-shadow(0 0 30px rgba(255,207,74,.45));animation:bob 3s ease-in-out infinite}
.logo .top small{font-size:.42em;vertical-align:top}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
.logo h1{font-family:'Secular One',sans-serif;font-weight:400;font-size:clamp(34px,10vw,54px);margin:4px 0 0;text-shadow:0 0 22px rgba(255,61,139,.7)}
.meta{color:var(--muted);font-size:15px;margin:8px 0 34px}
.meta b{color:var(--ink)}
.startBtn{position:relative;padding:22px 34px;border-radius:999px;font-size:clamp(22px,6.4vw,32px);font-weight:900;color:#2a0a00;
  background:linear-gradient(90deg,var(--gold),var(--gold2),var(--pink),var(--gold));background-size:300% 100%;
  white-space:nowrap;box-shadow:0 0 0 6px rgba(255,207,74,.18),0 14px 50px rgba(255,61,139,.45);animation:glow 2.2s ease-in-out infinite,shift 6s linear infinite}
.startBtn:active{transform:scale(.96)}
@keyframes glow{50%{box-shadow:0 0 0 14px rgba(255,207,74,.06),0 14px 60px rgba(255,61,139,.7)}}
@keyframes shift{to{background-position:300% 0}}
.resume{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{padding:11px 18px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:15px}
.marquee{position:fixed;bottom:0;left:0;right:0;z-index:1;overflow:hidden;white-space:nowrap;font-family:Bungee;font-size:12px;color:rgba(255,255,255,.22);padding:8px 0}
.marquee span{display:inline-block;animation:mq 30s linear infinite}
@keyframes mq{from{transform:translateX(-50%)}to{transform:translateX(0)}}

/* REVEAL */
#rv{justify-content:center;align-items:center;overflow:hidden;cursor:pointer;background:rgba(10,4,22,.82);z-index:5}
#rv .lbl{font-family:'Secular One';font-size:clamp(26px,8vw,40px);color:var(--muted);opacity:0}
#rv .num{font-family:Bungee;font-size:clamp(150px,52vw,300px);line-height:1;opacity:0;
  background:linear-gradient(180deg,#fff 0%,var(--c1,var(--gold)) 50%,var(--c2,var(--gold2)) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 8px 0 rgba(0,0,0,.45)) drop-shadow(0 0 40px var(--c1,var(--gold)))}
#rv .sub{font-family:'Secular One';font-size:clamp(20px,6vw,30px);min-height:1.4em;opacity:0;color:var(--pink);text-align:center}
#rv .ring{position:absolute;width:60vmin;height:60vmin;border-radius:50%;border:3px solid var(--c1,var(--gold));opacity:0}
#rv .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.eq{display:flex;gap:6px;align-items:flex-end;height:46px;margin-top:22px;opacity:0}
.eq i{width:8px;border-radius:3px;background:linear-gradient(var(--pink),var(--gold));animation:eq .5s ease-in-out infinite alternate}
@keyframes eq{from{height:8px}to{height:46px}}
.skip{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));font-size:12px;color:rgba(255,255,255,.35)}

/* SONG */
.bar{width:100%;max-width:560px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ibtn{flex:none;width:44px;height:44px;border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:19px;display:grid;place-items:center}
.prog{flex:1;text-align:center}
.prog .t{font-size:12px;color:var(--muted)}
.prog .pb{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:5px;overflow:hidden}
.prog .pb i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--gold));border-radius:9px;transition:width .6s}
.hero{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:18px auto 8px}
.vinyl{position:absolute;inset:4%;border-radius:50%;left:-22%;
  background:repeating-radial-gradient(circle,#111 0 2px,#1d1d1d 2px 4px);box-shadow:0 10px 40px rgba(0,0,0,.6);animation:spin 3s linear infinite}
.vinyl::after{content:'';position:absolute;inset:36%;border-radius:50%;background:radial-gradient(circle,#111 0 9%,var(--pink) 10% 100%)}
@keyframes spin{to{transform:rotate(360deg)}}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.12)}
.rankTag{position:absolute;top:-16px;right:-16px;min-width:76px;height:76px;padding:0 8px;border-radius:22px;display:grid;place-items:center;
  font-family:Bungee;font-size:36px;color:#2a0a00;background:linear-gradient(180deg,#fff2b0,var(--gold) 50%,var(--gold2));
  box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 0 4px var(--bg);transform:rotate(8deg)}
.rankTag.silver{background:linear-gradient(180deg,#fff,#d6dde8 50%,#9aa6b8)}
.rankTag.bronze{background:linear-gradient(180deg,#ffe0c2,#e09858 50%,#a8622a)}
.rankTag.plain{background:linear-gradient(180deg,#ffd0e4,var(--pink) 55%,#b0185a);color:#fff}
.songT{font-family:'Secular One';font-weight:400;font-size:clamp(28px,8.5vw,42px);line-height:1.1;margin:18px 0 4px;text-align:center}
.songA{font-size:clamp(17px,5vw,21px);color:var(--muted);text-align:center}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.chip{padding:6px 12px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.chip b{color:var(--gold)}
.firsts{margin-top:10px;padding:10px 16px;border-radius:16px;text-align:center;font-size:16px;
  background:linear-gradient(90deg,rgba(255,207,74,.16),rgba(255,61,139,.16));box-shadow:inset 0 0 0 1px rgba(255,207,74,.4)}
.firsts b{color:var(--gold)}
.acts{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;width:100%;margin:18px 0 6px}
.act{padding:15px 10px;border-radius:16px;font-weight:700;font-size:17px;text-align:center;display:flex;align-items:center;justify-content:center;gap:7px}
.act.play{background:#ff2b2b;color:#fff;box-shadow:0 8px 22px rgba(255,43,43,.35)}
.act.ch{background:var(--cyan);color:#05212a;box-shadow:0 8px 22px rgba(61,224,255,.3)}
.fav{width:58px;border-radius:16px;font-size:26px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);transition:transform .2s}
.fav.on{background:rgba(255,61,139,.2);box-shadow:inset 0 0 0 2px var(--pink)}
.fav.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35)}}
.nav{display:flex;gap:10px;width:100%;margin-top:14px}
.nav .prev{flex:none;padding:16px 14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:15px;color:var(--muted)}
.nav .next{flex:1;padding:18px 12px;border-radius:18px;font-size:20px;font-weight:900;color:#2a0a00;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 10px 30px rgba(255,159,28,.35)}
.nav .next.final{background:linear-gradient(90deg,var(--pink),var(--gold));}
.in{animation:rise .7s cubic-bezier(.2,.9,.3,1.2) both}
.in2{animation:rise .7s .12s cubic-bezier(.2,.9,.3,1.2) both}
.in3{animation:rise .7s .24s cubic-bezier(.2,.9,.3,1.2) both}
.coverIn{animation:flipIn .9s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
@keyframes flipIn{from{opacity:0;transform:perspective(700px) rotateY(-80deg) scale(.7)}}

/* TIE */
.tieH{font-family:'Secular One';font-size:clamp(30px,9vw,44px);margin:8px 0 0;text-align:center;color:var(--gold)}
.tieP{color:var(--muted);text-align:center;margin:4px 0 14px;font-size:15px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tc{background:var(--card);border-radius:16px;padding:8px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:6px;position:relative}
.tc.pick{box-shadow:inset 0 0 0 3px var(--gold),0 0 30px rgba(255,207,74,.35)}
.tc img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px}
.tc .t{font-weight:700;font-size:15px;line-height:1.2}
.tc .a{font-size:12px;color:var(--muted)}
.tc .f{font-size:12px;color:var(--gold)}
.tc .row{display:flex;gap:5px}
.tc .row>*{flex:1;padding:9px 0;border-radius:10px;text-align:center;font-size:15px;background:rgba(255,255,255,.08)}
.tc .row .p{background:#ff2b2b}.tc .row .c{background:var(--cyan);color:#05212a}
.tc .row .fv.on{background:rgba(255,61,139,.35)}
.tc .pk{padding:9px;border-radius:10px;font-weight:700;font-size:14px;background:rgba(255,207,74,.15);color:var(--gold)}
.tc.pick .pk{background:var(--gold);color:#2a0a00}

/* SHEET + FINAL list */
.sheetBg{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6);display:none}
.sheetBg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-height:82vh;overflow-y:auto;background:#1c0f38;border-radius:24px 24px 0 0;padding:14px 14px max(18px,env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-width:600px;margin:0 auto}
.sheet.on{transform:none}
.sheet h3,.finalH{font-family:'Secular One';font-weight:400;margin:4px 4px 10px;font-size:22px}
.li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;width:100%;text-align:right}
.li:active,.li.cur{background:rgba(255,255,255,.08)}
.li .r{flex:none;width:40px;font-family:Bungee;font-size:20px;color:var(--gold);text-align:center}
.li img{flex:none;width:46px;height:46px;border-radius:8px;object-fit:cover}
.li .m{flex:1;min-width:0}
.li .m .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .m .a{font-size:13px;color:var(--muted)}
.li .h{color:var(--pink)}
.share{display:flex;gap:8px;margin-top:12px}
.share button{flex:1;padding:13px;border-radius:14px;font-weight:700;background:var(--pink);color:#fff}
.share button.cp{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.finalTop{font-family:Bungee;font-size:clamp(60px,20vw,110px);color:var(--gold);text-shadow:0 0 30px rgba(255,207,74,.6);margin-top:10px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);z-index:20;background:#fff;color:#1a0f2e;padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;border-radius:2px}
.mute[hidden]{display:none}.mute{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:12;width:40px;height:40px;border-radius:12px;background:var(--card);font-size:18px}
@media (min-width:900px){.hero{width:380px}}
</style>
</head>
<body>
<div class="bgfx"><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="stars" id="stars"></div></div>
<button class="mute" id="mute" aria-label="סאונד">🔊</button>

<section class="scr" id="home">
  <div class="wrap">
    <div class="kicker">THE JAM CHART · 2026</div>
    <div class="logo"><div class="top"><small>TOP</small>25</div><h1>מצעד הג'אם</h1></div>
    <div class="meta" id="meta"></div>
    <button class="startBtn" id="start">🎤 מתחילים את הערב</button>
    <div class="resume" id="resume"></div>
  </div>
  <div class="marquee"><span id="mq"></span></div>
</section>

<section class="scr" id="rv" hidden>
  <div class="ring" id="ring"></div>
  <div class="lbl" id="rvLbl">מקום</div>
  <div class="num" id="rvNum">25</div>
  <div class="sub" id="rvSub"></div>
  <div class="eq" id="eq"></div>
  <div class="flash" id="flash"></div>
  <div class="skip">נגיעה לדילוג</div>
</section>

<section class="scr" id="song" hidden><div class="wrap" id="songBody"></div></section>
<section class="scr" id="final" hidden><div class="wrap" id="finalBody"></div></section>

<div class="sheetBg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>

/* ---------- sound: drum roll + crash (Web Audio, no files) ---------- */
let AC = null;
function ac(){ if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function noise(ctx, dur){ const b = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = ctx.createBufferSource(); s.buffer = b; return s; }
function hit(ctx, t, vol, dur, freq, type){ const s = noise(ctx, dur), f = ctx.createBiquadFilter(), g = ctx.createGain();
  f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  s.connect(f); f.connect(g); g.connect(ctx.destination); s.start(t); s.stop(t + dur); }
function boom(ctx, t, vol){ const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(40, t + .5);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + .6); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + .6); }
function drumroll(sec, big){ if (st.mute) return; const ctx = ac(); if (!ctx) return; ctx.resume && ctx.resume();
  const t0 = ctx.currentTime + .05; let t = 0;
  while (t < sec) { const gap = Math.max(.035, .11 - t * .045); hit(ctx, t0 + t, .12 + .3 * t / sec, .09, 1800, 'bandpass'); t += gap; }
  hit(ctx, t0 + sec, big ? .9 : .6, big ? 2.2 : 1.4, 5000, 'highpass'); boom(ctx, t0 + sec, big ? 1 : .7); }

const sleep = ms => new Promise(r => setTimeout(r, ms));
const tierCol = r => r === 1 ? ['#fff2b0','#ffb300'] : r === 2 ? ['#ffffff','#9aa6b8'] : r === 3 ? ['#ffe0c2','#c07a3a'] : r <= 10 ? ['#ffd0e4','#ff3d8b'] : ['#bff6ff','#3de0ff'];
const tagCls = r => r === 1 ? '' : r === 2 ? 'silver' : r === 3 ? 'bronze' : 'plain';

let skipFn = null;
$('#rv').addEventListener('click', () => skipFn && skipFn());

async function reveal(k){
  const p = P(k), r = p.rank, top3 = r <= 3, dur = r === 1 ? 3.2 : top3 ? 2.6 : 1.9;
  const [c1, c2] = tierCol(r);
  const rv = $('#rv'); rv.style.setProperty('--c1', c1); rv.style.setProperty('--c2', c2);
  $('#rvNum').textContent = r; $('#rvLbl').textContent = r === 1 ? 'ו… המקום הראשון' : 'מקום';
  $('#rvSub').textContent = p.tie ? `שוויון! ${p.songs.length} שירים על ${p.free > 1 ? p.free + ' מקומות' : 'מקום אחד'}` : r === 1 ? '👑' : top3 ? '🔥 הפודיום 🔥' : r === 10 ? 'נכנסים לטופ 10!' : '';
  $('#eq').innerHTML = Array.from({length: 11}, (_, i) => `<i style="animation-delay:${-i*.13}s;animation-duration:${.3+Math.random()*.35}s"></i>`).join('');
  for (const id of ['#rvLbl','#rvNum','#rvSub','#eq','#ring','#flash']) { $(id).getAnimations().forEach(a => a.cancel()); $(id).style.opacity = 0; }
  show('rv'); drumroll(dur, top3);
  let skipped = false; const skip = new Promise(res => skipFn = () => { skipped = true; res(); });
  const wait = ms => Promise.race([sleep(ms), skip]);
  const A = (sel, kf, o) => $(sel).animate(kf, {fill: 'forwards', easing: 'cubic-bezier(.2,.9,.3,1.2)', ...o});
  A('#rvLbl', [{opacity:0, transform:'translateY(-30px)'}, {opacity:1, transform:'none'}], {duration: 500});
  A('#eq', [{opacity:0}, {opacity:1}], {duration: 400});
  // the number "spins" through random places before landing
  const roll = setInterval(() => { $('#rvNum').textContent = 1 + Math.floor(Math.random() * N); $('#rvNum').style.opacity = .25; }, 70);
  await wait(dur * 1000 - 250);
  clearInterval(roll);
  $('#rvNum').textContent = r; $('#rvNum').style.opacity = '';
  A('#rvNum', [{opacity:0, transform:'scale(3) rotate(-12deg)', filter:'blur(14px)'}, {opacity:1, transform:'scale(1)', filter:'blur(0)'}], {duration: skipped ? 200 : 650});
  A('#flash', [{opacity:.85}, {opacity:0}], {duration: 600, easing: 'ease-out'});
  A('#ring', [{opacity:.9, transform:'scale(.3)'}, {opacity:0, transform:'scale(2.4)'}], {duration: 900, easing: 'ease-out'});
  A('#rvSub', [{opacity:0, transform:'scale(.6)'}, {opacity:1, transform:'none'}], {duration: 500, delay: 250});
  if (top3 || p.tie) confetti(r === 1 ? 160 : 70);
  await wait(skipped ? 350 : (p.tie ? 1600 : 1150));
  skipFn = null;
}

async function go(k, animate){
  k = Math.max(0, Math.min(N - 1, k));
  if (animate && k > st.max) await reveal(k);
  st.cur = k; st.max = Math.max(st.max, k); save();
  render(k, animate);
}

function favBtn(s, cls){ return `<button class="${cls} ${st.favs[s.id] ? 'on' : ''}" data-fav="${s.id}" aria-label="מועדף">${st.favs[s.id] ? '❤️' : '🤍'}</button>`; }

const firstsTxt = s => s.firsts.length ? `🥇 מקום ראשון אצל: <b>${s.firsts.map(esc).join(', ')}</b>` : '';

function render(k, fresh){
  const p = P(k), r = p.rank, pct = Math.round((k + 1) / N * 100);
  const nextP = k < N - 1 ? P(k + 1) : null, prevP = k > 0 ? P(k - 1) : null;
  const bar = `<div class="bar"><button class="ibtn" id="toHome" aria-label="בית">⌂</button>
    <div class="prog"><div class="t">${k + 1} מתוך ${N} במצעד</div><div class="pb"><i style="width:${pct}%"></i></div></div>
    <button class="ibtn" id="openList" aria-label="רשימה">📜</button></div>`;

      <div class="tieP in2">${p.songs.length} שירים עם ${p.songs[0].points} נקודות בדיוק, ${p.free > 1 ? 'ל-' + p.free + ' מקומות' : 'על מקום אחד'}. תבחרו ביחד 👇</div>

        <img src="${BASE}${s.id}.jpg" alt="">

  } else {
    const s = p.songs[0];
    body = bar + `<div class="hero ${fresh ? 'coverIn' : ''}"><div class="vinyl"></div><img class="cover" src="${BASE}${s.id}.jpg" alt=""><div class="rankTag ${tagCls(r)}">${r}</div></div>

      <div class="acts in3"><a class="act play" href="${ytUrl(s)}" target="_blank" rel="noopener">▶ נגן את השיר</a>
        <a class="act ch" href="${s.chords}" target="_blank" rel="noopener">🎸 אקורדים</a>${favBtn(s, 'fav')}</div>` + nav;
  }
  $('#songBody').innerHTML = body; show('song');
  $('#toHome').onclick = homeScreen; $('#openList').onclick = openList;
  $('#prev') && ($('#prev').onclick = () => go(k - 1, false));
  $('#next').onclick = () => nextP ? go(k + 1, true) : finale();
}

/* favourites: kept on this phone + sent to Dori's sheet (row name "♥ מועדף") */
function toggleFav(id, el){
  const on = !st.favs[id]; if (on) st.favs[id] = Date.now(); else delete st.favs[id]; save();
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b => { b.classList.toggle('on', on); b.textContent = on ? '❤️' : '🤍'; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); });
  toast(on ? '❤️ נוסף למועדפים' : 'הוסר מהמועדפים');
  const s = allSongs.find(x => x.id === id);
  if (ENDPOINT) fetch(ENDPOINT, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({name: '♥ מועדף', shortlist: on ? 'on' : 'off', ranking: [{rank: s.rank, id, title: s.title, artist: s.artist, dev: st.dev}]})}).catch(() => {});
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]'); if (f) return toggleFav(+f.dataset.fav, f);
  const pk = e.target.closest('[data-pick]'); if (pk) { const id = +pk.dataset.pick; st.pick = st.pick === id ? null : id; save(); render(st.cur); if (st.pick) { toast('✓ נבחר!'); confetti(40); } return; }
  const j = e.target.closest('[data-jump]'); if (j) { closeList(); go(+j.dataset.jump, false); }
});

    const s = p.tie ? (p.songs.find(x => x.id === st.pick) || null) : p.songs[0];
    out.push(`<button class="li ${k === curK ? 'cur' : ''}" data-jump="${k}"><span class="r">${p.rank}</span>
      ${s ? `<img src="${BASE}${s.id}.jpg" alt="">` : '<span style="width:46px;font-size:28px;text-align:center">⚖️</span>'}
      <span class="m"><div class="t" dir="auto">${s ? esc(s.title) : `שוויון: ${p.songs.length} שירים`}</div><div class="a" dir="auto">${s ? esc(s.artist) : 'עוד לא בחרתם'}</div></span>
      ${(p.songs.some(x => st.favs[x.id])) ? '<span class="h">❤️</span>' : ''}</button>`); }
  return out.reverse().join('');
}
const shareBox = () => `<div class="share"><button id="shFav">📤 שליחת המועדפים</button><button class="cp" id="cpFav">📋 העתקה</button></div>`;
function openList(){
  $('#sheet').innerHTML = `<h3>📜 מה נחשף עד עכשיו</h3>${rowsHtml(st.max, st.cur)}${shareBox()}`;
  $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on'); wireShare();
}
function closeList(){ $('#sheet').classList.remove('on'); $('#sheetBg').classList.remove('on'); }
$('#sheetBg').onclick = closeList;

function favText(){
  const f = allSongs.filter(s => st.favs[s.id]).sort((a, b) => a.rank - b.rank);
  if (!f.length) return '';
  return "❤️ המועדפים שלי ממצעד הג'אם\n\n" + f.map((s, i) => `${i + 1}. ${s.title} – ${s.artist}\n🎸 ${s.chords}`).join('\n\n');
}
function wireShare(){
  const sh = $('#shFav'), cp = $('#cpFav'); if (!sh) return;
  sh.onclick = async () => { const t = favText(); if (!t) return toast('עוד אין מועדפים 🤍');
    if (navigator.share) { try { await navigator.share({title: "מועדפים – מצעד הג'אם", text: t}); } catch (e) {} }
    else window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank'); };
  cp.onclick = async () => { const t = favText(); if (!t) return toast('עוד אין מועדפים 🤍');
    try { await navigator.clipboard.writeText(t); toast('📋 הועתק'); } catch (e) { toast('לא הצלחתי להעתיק'); } };
}

function finale(){
  st.max = N - 1; save();
  const winner = C[0].songs[0];
  $('#finalBody').innerHTML = `<div class="finalTop in">TOP 25</div>
    <div class="finalH in2" style="text-align:center;font-size:28px">🏆 זה המצעד! תודה לכל ${DATA.voters} המצביעים</div>
    <div class="firsts in2" style="margin-bottom:12px">👑 מקום ראשון: <b dir="auto">${esc(winner.title)}</b></div>
    <div style="width:100%" class="in3">${rowsHtml(N - 1, -1)}</div>${shareBox()}
    <div class="resume"><button class="ghost" id="fHome">⌂ למסך הבית</button></div>`;
  show('final'); confetti(200); drumroll(.01, true); wireShare();
  $('#fHome').onclick = homeScreen;
}

function homeScreen(){
  closeList();
  const r = $('#resume');
  if (st.max >= 0) {
    $('#start').textContent = '🎤 ממשיכים את הערב';
    r.innerHTML = `<button class="ghost" id="restart">↺ מתחילים מחדש</button>`;
    $('#restart').onclick = () => { if (confirm('להתחיל את המצעד מההתחלה? (המועדפים נשמרים)')) { st.cur = -1; st.max = -1; st.pick = null; save(); homeScreen(); } };
  } else { $('#start').textContent = '🎤 מתחילים את הערב'; r.innerHTML = ''; }
  show('home');
}
$('#start').onclick = () => { ac(); if (st.max < 0) go(0, true); else if (st.max >= N - 1 && st.cur >= N - 1) finale(); else go(Math.max(st.cur, 0), false); };

function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 1600); }
function confetti(n){
  const cols = ['#ffcf4a','#ff3d8b','#3de0ff','#fff6e6','#ff9f1c','#9b5cff'];
  for (let i = 0; i < n; i++) { const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    document.body.appendChild(c);
    const x = (Math.random() - .5) * 220, rot = Math.random() * 900;
    c.animate([{transform: 'translate(0,0) rotate(0)'}, {transform: `translate(${x}px,105vh) rotate(${rot}deg)`}],
      {duration: 1800 + Math.random() * 1800, delay: Math.random() * 500, easing: 'cubic-bezier(.25,.6,.4,1)'}).onfinish = () => c.remove(); }
}
homeScreen();
</script>
</body>
</html>
